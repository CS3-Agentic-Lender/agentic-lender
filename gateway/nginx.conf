# Local stand-in for the AWS load balancer and WAF (docs/api-design.md section 6).
# Specified: 300 requests per 5 minutes per IP, 20 sign-ups per minute per IP.
# nginx uses a leaky bucket, not the WAF's rolling window, so these are sized as a ceiling: any
# window admits at most burst + 1 + rate x window requests, which is exactly the specified limit.
# Sustained traffic is therefore held to half the limit (30/min) once the burst is spent, so
# nothing above the spec gets through. The managed WAF rule sets are not copied.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

# POST /core/me only: 20 per minute per IP. An empty key is not counted, so other methods pass.
map $request_method $signup_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $signup_key zone=signup:10m rate=10r/m;

limit_req_status 429;

server {
    listen 8000;

    # Docker's DNS, looked up per request, so the gateway starts even before al-core exists.
    resolver 127.0.0.11 valid=10s;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    error_page 429 = @limited;
    location @limited {
        add_header Retry-After 60 always;
        return 429 "Too many requests\n";
    }

    location /ai/ {
        limit_req zone=api burst=149 nodelay;
        set $al_ai http://al-ai:5001;
        proxy_pass $al_ai;
    }

    location = /core/me {
        limit_req zone=api burst=149 nodelay;
        limit_req zone=signup burst=9 nodelay;
        set $al_core http://al-core:5002;
        proxy_pass $al_core;
    }

    location /core/ {
        limit_req zone=api burst=149 nodelay;
        set $al_core http://al-core:5002;
        proxy_pass $al_core;
    }
}
