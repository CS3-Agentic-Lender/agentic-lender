[project]
name = "al-core"
version = "0.1.0"
description = "AL core service: profiles, applications, sign-off and the ledger"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "firebase-admin>=6.5",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
