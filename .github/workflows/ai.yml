# Runs al-ai's pytest suite on PRs that change al-ai/.
name: AI tests

on:
  pull_request:
    paths:
      - "al-ai/**"
      - ".github/workflows/ai.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: al-ai
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --locked

      - run: uv run pytest
