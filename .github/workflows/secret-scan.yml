# Scans every commit in a PR for secrets. This is the enforced check:
# the local pre-commit hook can be skipped with --no-verify, this can't.
name: Secret scan

on:
  pull_request:

permissions:
  contents: read

env:
  BETTERLEAKS_VERSION: 1.8.1

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install betterleaks
        run: |
          base="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}"
          file="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$file"
          curl -fsSLO "$base/checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$file" betterleaks
          sudo mv betterleaks /usr/local/bin/

      - name: Scan PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: betterleaks git --redact --verbose --log-opts="$BASE_SHA..$HEAD_SHA" .
