# Runs the portal's Vitest suite on PRs that change al-web/.
# ponytail: add ".github/workflows/web.yml" to paths once al-web/package.json is on main;
# until then a change to this file alone would run it against an empty folder.
name: Web tests

on:
  pull_request:
    paths:
      - "al-web/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: al-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: al-web/package-lock.json

      - run: npm ci

      - run: npm test
