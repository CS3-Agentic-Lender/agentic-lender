# Local stack behind one gateway on localhost:8000, the same paths as api.<domain> on AWS.
# The Firebase emulators run on the host (firebase emulators:start --project demo-al).
services:
  al-ai:
    build: ./al-ai
    ports:
      - "5001:5001"
    environment:
      FIREBASE_PROJECT_ID: demo-al
      FIREBASE_AUTH_EMULATOR_HOST: host.docker.internal:9099
      # Stand-in benchmark mortgage rate (percent) and its month, the 4.00% test rate from the ticket,
      # until the ECB rate tool exists. Without both, /ai/affordability returns 503.
      BENCHMARK_RATE_PCT: "4.0"
      BENCHMARK_RATE_DATE: "2026-08"

  al-core:
    build: ./al-core
    ports:
      - "5002:5002"
    environment:
      FIREBASE_PROJECT_ID: demo-al
      FIREBASE_AUTH_EMULATOR_HOST: host.docker.internal:9099
      FIRESTORE_EMULATOR_HOST: host.docker.internal:8080

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - al-ai
      - al-core
