# Local stack behind one gateway on localhost:8000, the same paths as api.<domain> on AWS.
# The Firebase emulators run on the host (firebase emulators:start --project demo-al).
services:
  al-ai:
    build: ./al-ai
    ports:
      - "5001:5001"
    environment:
      FIREBASE_PROJECT_ID: demo-al
      FIREBASE_AUTH_EMULATOR_HOST: host.docker.internal:9099
      FIRESTORE_EMULATOR_HOST: host.docker.internal:8080  # the ECB rate cache (rates_cache) and the committee listener

  al-core:
    build: ./al-core
    ports:
      - "5002:5002"
    environment:
      FIREBASE_PROJECT_ID: demo-al
      FIREBASE_AUTH_EMULATOR_HOST: host.docker.internal:9099
      FIRESTORE_EMULATOR_HOST: host.docker.internal:8080
      # The fast-track fee (Stripe test mode). From your shell, or from a .env file next to this one (Compose reads it on its own).
      # Empty by default: without them the fee endpoint answers 503. See "The fast-track fee" in al-core/README.md.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - al-ai
      - al-core
